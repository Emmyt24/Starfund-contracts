name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  fmt-build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.1
          components: rustfmt, clippy, llvm-tools-preview
          targets: wasm32v1-none

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt -p starfund_escrow -- --check

      - name: Clippy
        run: cargo clippy -p starfund_escrow -- -D warnings

      - name: Build
        run: cargo build

      - name: Run tests
        run: cargo test

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Add WASM target
        run: rustup target add wasm32v1-none
      - name: Build WASM
        run: cargo build --target wasm32v1-none --release -p starfund_escrow

      - name: Workspace Clippy (all targets)
        run: cargo clippy -p starfund_escrow --all-targets -- -D warnings

      - name: Check coverage (report)
        run: |
          cargo llvm-cov \
            --features testutils \
            --summary-only \
            --fail-under-lines 90 \
            -p starfund_escrow

  wasm-isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.1
          targets: wasm32v1-none

      - name: Cache cargo registry and build
        uses: Swatinem/rust-cache@v2

      - name: Build production WASM (no testutils)
        run: cargo build --target wasm32v1-none --release --no-default-features -p starfund_escrow

      - name: Inspect production dependency graph
        run: |
          cargo tree --target wasm32v1-none -p starfund_escrow --no-default-features \
            --edges normal,build > production-tree.txt
          echo "--- Production graph (wasm32v1-none, no-default-features) ---"
          cat production-tree.txt

      - name: Compare against testutils graph
        run: |
          cargo tree --target wasm32v1-none -p starfund_escrow --features testutils \
            --edges normal,build > testutils-tree.txt
          echo "--- Testutils graph (wasm32v1-none, features=testutils) ---"
          cat testutils-tree.txt
          echo "--- Diff (production vs testutils) ---"
          diff -u production-tree.txt testutils-tree.txt || true

      - name: Assert production graph excludes test-only facilities
        run: |
          # Native test-only facilities must never leak into the production graph.
          # Keep this list in sync with the testutils feature boundary in escrow/Cargo.toml.
          FORBIDDEN='testutils|soroban-sdk.*testutils|rand|getrandom|ed25519-dalek|proptest|mockall'
          if grep -Eiq "$FORBIDDEN" production-tree.txt; then
            echo "::error::Production WASM dependency graph contains test-only/native facilities:"
            grep -Ein "$FORBIDDEN" production-tree.txt
            exit 1
          fi
          echo "OK: production graph is free of testutils and native test-only facilities."

  cargo-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.1

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Audit dependencies
        run: cargo audit --locked

  openapi-docs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate docs/openapi.yaml
        run: npm test
